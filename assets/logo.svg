<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#134E4A"/>
    </linearGradient>
    <linearGradient id="folderGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>

  <!-- Rounded teal background (iOS app icon container) -->
  <rect x="0" y="0" width="1024" height="1024" rx="220" fill="url(#bgGradient)"/>

  <!-- Folder tab -->
  <path d="M 220 380
           L 220 340
           Q 220 300 260 300
           L 450 300
           Q 475 300 490 320
           L 520 360
           L 800 360
           Q 824 360 824 384
           L 824 420
           L 220 420 Z"
        fill="#CBD5E1"/>

  <!-- Folder body -->
  <rect x="200" y="400" width="624" height="430" rx="40" fill="url(#folderGradient)"/>

  <!-- Subtle top highlight on folder -->
  <rect x="200" y="400" width="624" height="6" rx="3" fill="#FFFFFF" opacity="0.7"/>

  <!-- Calendar page on folder face -->
  <rect x="312" y="470" width="400" height="296" rx="22" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>

  <!-- Calendar amber header strip -->
  <path d="M 312 492
           Q 312 470 334 470
           L 690 470
           Q 712 470 712 492
           L 712 548
           L 312 548 Z"
        fill="#F59E0B"/>

  <!-- Header binder holes -->
  <circle cx="380" cy="450" r="14" fill="#0F766E"/>
  <circle cx="644" cy="450" r="14" fill="#0F766E"/>

  <!-- Calendar grid -->
  <g fill="#94A3B8">
    <circle cx="370" cy="600" r="14"/>
    <circle cx="438" cy="600" r="14"/>
    <circle cx="506" cy="600" r="14"/>
    <circle cx="574" cy="600" r="14"/>
    <circle cx="642" cy="600" r="14"/>

    <circle cx="370" cy="660" r="14"/>
    <circle cx="438" cy="660" r="14"/>
    <circle cx="574" cy="660" r="14"/>
    <circle cx="642" cy="660" r="14"/>

    <circle cx="370" cy="720" r="14"/>
    <circle cx="438" cy="720" r="14"/>
    <circle cx="506" cy="720" r="14"/>
    <circle cx="574" cy="720" r="14"/>
    <circle cx="642" cy="720" r="14"/>
  </g>

  <!-- Highlighted "today" cell -->
  <circle cx="506" cy="660" r="22" fill="#F59E0B"/>
  <circle cx="506" cy="660" r="22" fill="none" stroke="#FFFFFF" stroke-width="4"/>
</svg>
